[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "xtask"]

[workspace.package]
version = "0.6.0"
authors = ["Yusai Tajiri"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[profile.dev.package."*"]
# whisper.cpp and the DSP crates are unusably slow without optimizations.
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
