[package]
name = "chidori"
description = "Live transcription with local Whisper"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Release builds enable Vulkan for Whisper; local builds without the Vulkan SDK stay CPU-only.
gpu-vulkan = ["chidori-core/gpu-vulkan"]
# Local NVIDIA builds only (needs the CUDA toolkit).
gpu-cuda = ["chidori-core/gpu-cuda"]

[dependencies]
chidori-core = { path = "../core" }

# The UI draws on the GPU (wgpu); tiny-skia is only the fallback for a PC where wgpu can't start.
iced = { version = "=0.14.0", features = ["canvas", "svg", "image-without-codecs", "lazy", "tokio", "advanced"] }
# The tray icon and native popup menus (muda, re-exported), and global hotkeys.
tray-icon = "=0.26.1"
global-hotkey = "=0.9.0"
rfd = "=0.17.2"
arboard = { version = "3.7.0", default-features = false }
open = "5.4.5"
raw-window-handle = "0.6.2"
# Plays a finished session's sound (FR-09).
cpal = "=0.18.2"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
tracing-appender = "0.2.5"
parking_lot = "0.12.5"
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["sync"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_System_Threading",
  "Win32_Security",
] }

[build-dependencies]
serde_json = "1.0.151"
winresource = "0.1.34"

[dev-dependencies]
iced_test = "=0.14.0"
tempfile = "3.27.0"
