name: ci

# Docs-only changes skip the build; the installer comes from release.yml.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners vary; build the same portable AVX2 code the release ships.
  GGML_NATIVE: "OFF"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      # whisper.cpp's Vulkan build nests MSBuild paths deep enough to pass MAX_PATH under the
      # default target dir. rust-cache below points at the same folder.
      - name: Short cargo target dir
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\..\t"))" >> $env:GITHUB_ENV'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # glslc compiles whisper.cpp's Vulkan shaders. bindgen uses the runner's preinstalled LLVM.
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ". -> ../t"
      - run: cargo fmt --all --check
      - name: cargo clippy (the GPU build that ships)
        run: cargo clippy --workspace --all-targets --features chidori/gpu-vulkan -- -D warnings
      - name: cargo test
        # CPU build: the runner has no GPU driver.
        run: cargo test --workspace
