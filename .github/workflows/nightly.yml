name: nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GGML_NATIVE: "OFF"
      CHIDORI_TEST_CPU: "1"
      CHIDORI_REQUIRE_FIXTURES: "1"
      # base-q5 loses more accuracy than turbo-q5 when cut into utterances (about 4 points
      # here). The section 18 three-point rule is checked with turbo-q5 on the reference GPU
      # machine; this run guards against regressions.
      CHIDORI_CER_MARGIN: "0.06"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: nightly
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      # LibriVox MP3s (checked against pinned SHA-256s) and the base-q5 model.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            tests/fixtures/cache
            ${{ runner.temp }}/models
          key: fixtures-and-models-v1
      - name: Build fixtures
        run: python tests/fixtures/build_fixtures.py
      - name: Download base-q5
        run: cargo run --release -p chidori-core --example download_model -- base-q5 "${{ runner.temp }}/models"
      - name: Integration tests (CPU)
        env:
          CHIDORI_TEST_MODEL: ${{ runner.temp }}/models/ggml-base-q5_1.bin
        run: cargo test --release -p chidori-core --test pipeline -- --ignored --nocapture --test-threads 1
